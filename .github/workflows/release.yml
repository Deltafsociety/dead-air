name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: deadair
            archive_name: deadair-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: deadair.exe
            archive_name: deadair-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: deadair
            archive_name: deadair-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: deadair
            archive_name: deadair-macos-x86_64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux and macOS
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.archive_name }} ${{ matrix.binary_name }}
          cd ../../..

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.archive_name }} ${{ matrix.binary_name }}
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  build-gui-desktop:
    name: Build Desktop GUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (WebKit2GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Desktop GUI binary
        run: cargo build --release -p deadair-gui

      - name: Package GUI binary
        run: |
          mkdir -p dist
          cp target/release/deadair-gui dist/
          tar -czvf deadair-gui-linux-x86_64.tar.gz -C dist deadair-gui

      - name: Upload Desktop GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadair-gui-linux-x86_64.tar.gz
          path: deadair-gui-linux-x86_64.tar.gz

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install Rust & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build Android APK
        run: |
          cd gui
          pnpm dlx @tauri-apps/cli android init --ci
          pnpm dlx @tauri-apps/cli android build --apk --target aarch64-linux-android
          mkdir -p ../dist
          cp $(find src-tauri/gen/android -name "*.apk" | grep -E "(release|universal)" | head -n 1) ../dist/deadair-android-arm64.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadair-android-arm64.apk
          path: dist/deadair-android-arm64.apk

  release:
    name: Publish Release
    needs: [build, build-gui-desktop, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
