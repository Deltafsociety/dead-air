[package]
name = "deadair"
version = "0.1.0"
edition = "2024"
authors = ["deltafsociety"]
description = "Offline-first intranet Nostr station for blackouts and domestic network partitions"
repository = "https://github.com/deltafsociety/dead-air"

[workspace]
members = [
    ".",
    "gui/src-tauri"
]

[lib]
name = "deadair"
path = "src/lib.rs"

[[bin]]
name = "deadair"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
dirs = "7.0.0"
futures-util = "0.3.34"
nostr = { version = "0.45.5", features = ["os-rng", "rand"] }
ratatui = "0.30.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
